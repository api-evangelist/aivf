name: AiVF
description: >-
  AIVF develops AI-powered software for in vitro fertilization (IVF) clinics, embryology
  laboratories, and patients. Its EMA platform applies computer vision and machine learning
  to embryo evaluation (AIVF Day-3 and Day-5), genetics, outcomes analytics, and clinic-patient
  communication to improve embryo selection and IVF success rates, alongside ART Compass by AIVF
  for fertility-lab benchmarking. AIVF holds a CE mark and names ISO 27001, ISO 27799, ISO 13485,
  HIPAA, and GDPR compliance; in the US an AI component is an investigational device. AIVF was
  surfaced as an Insight Partners portfolio company and added to the API Evangelist network.
  It publishes no public developer API — this profile captures the company's identity, security,
  and compliance surface.
